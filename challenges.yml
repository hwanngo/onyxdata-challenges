    formats: [XLSX, DOCX, PDF, TXT]   # verified 2025-10-28 from the ZIP; registry said [CSV] (5th correction)
    status: done
    notes: >-
      Completed 2025-10-28, G1-G8. Thesis: two datasets, one register. 62,516 complaints are a
      real register (IDs in strict date order rho=0.99999, weekends collapse to 0.37-0.52 of
      expected, product-issue taxonomy is a tree); the 1,081 companies are a uniform random
      overlay. Signature "The Diagonal of Nothing": every association test as chi2 vs df, with
      the chi2=df line drawn. Six company tests land ON it (0.945-1.018x df across 1,080-8,640
      df); eight consumer tests sit 5.7x-747x above. No overlap. So the file supports
      supervision PRIORITIES and answers nothing about supervision TARGETS -- and the two
      questions it appears to answer best (Q6's shipped KPI, Q5's response time) are computed
      entirely from the fabricated half. Affirmative findings: five product-issue pairs carry
      65.4% of all monetary relief on 42.2% of complaints; timeliness broke in 2021 (99.3 ->
      89.0) everywhere except Mortgage (99.58); the intake lag is the only real speed measure
      (Referral delayed 75.6% vs Web 7.8%, eps2=0.364) and does not vary by company.
      THREE ERRORS OF MINE, all corrected and recorded: I called the file "not broken" after
      testing only within-column identities (2,150 complaints were answered before they were
      received); I published 93.77% timeliness by counting in-progress as failures (96.06%);
      and three trend numbers were wrong, one of which contradicted my own integrity.py output.
      67/67 metrics reconciled, 27 pytest, 15/15 Malloy views across 2 sources, 12 integrity
      checks, 0 axe violations. Self-score 29/34 under the page's stated "3 = solid" bar.
      Not deployed: STACK.md defers.
