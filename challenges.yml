  - folder: "2025/09"
    era: 2
    title: "September 2025 DataDNA - Credit Risk (Nova Bank)"
    playground_url: "https://datadna.onyxdata.co.uk/playground/2025-09-september-2025-datadna-credit-risk-analytics-challenge/"
    challenge_url: "https://datadna.onyxdata.co.uk/challenges/september-2025-datadna-credit-risk-analytics-challenge/"
    dataset_url: "https://datadna.onyxdata.co.uk/wp-content/uploads/2025/09/DataDNA-Dataset-Challenge-Credit-Risk-Analytics-Dataset-September-2025.zip"   # scraped 2025-09-26   # scrape the Download Dataset anchor
    dataset_folder: "DataDNA-Dataset-Challenge-Credit-Risk-Analytics-Dataset-September-2025"
    formats: [XLSX, DOCX, PDF, TXT]   # verified 2025-09-26 from the ZIP; registry said [CSV] (4th correction)
    status: done
    notes: >-
      Completed 2025-09-26, G1-G8. Thesis: two boolean rules decide 42% of every default.
      RENT & loan_percent_income > 0.30 (n=2,345) and grade D-G & DEBTCONSOLIDATION & not
      OWN (n=741) both return 100.0000% with ZERO exceptions across 2,988 loans -- 9.17% of
      the book, $41.6M -- priced 14 basis points above the loans beside them. Tenure-specific:
      renters step 28.5% -> 100% between LTI 0.30 and 0.31 while mortgage-holders go
      15.7% -> 21.6%. Removing the rules flips DEBTCONSOLIDATION from riskiest purpose
      (28.59%) to second safest (9.97%) and drops grade D from 59.05% to 46.33%.
      32,581 rows x 29 cols, the programme's largest; client_ID IS unique (2nd of 5).
      The file is two blocks: 13 columns matching the widely-circulated public credit-risk
      dataset plus 16 generated (median effect on default 16x lower, zero nulls, all inside
      round bounds). Requirements in the ZIP's DOCX again -- 5 for 5. THREE theses: the first
      two were killed at G3 by two adversarial proxies, one for inferring generator behaviour
      from null results (3rd time in 4 months) and one for being false. My own self-attack
      was also wrong -- it tested the boundary at >= 0.30 instead of > 0.30 and disguised a
      deterministic rule as a gradient. 49/49 metrics reconciled, 30 pytest, 16/16 Malloy
      views across 2 sources, 0 axe violations, all contrast pairs clear AA first pass.
      Not deployed: STACK.md defers.
    zip_sha256: "d209ebed126c0eae3d858dedfa85e30b54c50a20270f1b72519d5cea2103070b"
    file_sha256:
