    formats: [CSV, MD]
    status: done
    sha256: "9aad2ee29776d650186aad914182cbd3f38bc288a41aba4608bd7e7b4731d6f0"
    notes: |
      Completed 2026-06-27, G1-G8. Thesis: this file reports 1,500 transactions and contains
      20 facts. Every customer has exactly 75 rows and four columns never vary within one --
      device_type is literally customer_id mod 4. Design effect = cluster size = 75, so every
      SE is 8.66x wider: the "20% fraud rate" is 4 of 20 customers, [5.7%, 43.7%].
      14 of 24 dictionary claims fail, including a UTF-8 BOM on all three dimension headers
      that renames the primary key and makes joins return nulls without raising.
      Positive control: fee_charged_gbp is the only column varying WITHIN a customer. 725 of
      1,500 rows break the rule; gross under GBP587.11 vs gross over GBP587.28 cancel to a net
      -0.023%, so the variance report shows a clean bill.
      Signature: The Twenty Blocks, a unit chart drawing all 1,500 marks in 20 solid columns.
      interact.mjs asserts the mark count and the distinct fill per column under two orderings.
      Self-caught error: grouping by type_name merged the two ATM Withdrawal ids and produced
      a rate belonging to neither -- the exact trap this month documented as I7.
    scores: {judge_34: 28, ai_storytelling: 4, ai_design: 4, ai_technical: 5, ai_insights: 5}

