    playground_url: "https://datadna.onyxdata.co.uk/playground/2025-08-august-2025-datadna-fitness-membership-analytics-challenge/"
    challenge_url: "https://datadna.onyxdata.co.uk/challenges/august-2025-datadna-fitness-membership-analytics-challenge/"
    dataset_url: "https://datadna.onyxdata.co.uk/wp-content/uploads/2025/07/DataDNA-Dataset-Challenge-Fitness-Membership-Analytics-Dataset-August-2025.zip"   # scraped 2025-08-31
    dataset_folder: "DataDNA-Dataset-Challenge-Fitness-Membership-Analytics-Dataset-August-2025"
    formats: [CSV, DOCX, PDF, TXT]   # verified 2025-08-31 from the ZIP
    status: done
    notes: >-
      Completed 2025-08-31, G1-G8. Thesis: the churn list is the loyalty list, inverted.
      last_visit_date is join_date rank-rescaled onto a 60-day window (rho=0.9999), so a
      30-day lapse rule flags 982 members and every one sits at or above the 982nd-highest
      tenure; no member under 549 days of tenure is flagged. Also: final_price is a pure
      lookup from three labels (max error 3.6e-15, 43 prices from 47 combos); access_hours
      is 1:1 with membership_type so brief Q7 and Q1 are one question; 0% churned. The one
      surviving behavioural effect is location -> session duration (eta2=0.023, omega2=0.019,
      permutation p=0.0001, robust to dropping both extremes) = a 35% spread in floor-hours.
      NO ID COLUMN AT ALL -- 4th month, 4th answer to the standing check. Requirements were
      in the ZIP's DOCX again (4th month running). First thesis was killed by adversarial
      review (two claims were the June tautology: inferring behaviour from the generator's
      failure to correlate columns); the correction found the coupling and is the month.
      30/30 metrics reconciled, 44 pytest, 13/13 Malloy views, 14/14 interaction checks,
      0 axe violations across 4 contexts, all contrast pairs clear AA. Not deployed:
      STACK.md defers.
