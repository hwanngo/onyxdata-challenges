  - folder: "2025/12"
    era: 2
    title: "December 2025 DataDNA - Animal Shelter Operations"
    playground_url: "https://datadna.onyxdata.co.uk/playground/2025-12-december-2025-datadna-animal-shelter-operations-challenge/"
    challenge_url: "https://datadna.onyxdata.co.uk/challenges/december-2025-datadna-animal-shelter-operations-challenge/"
    dataset_url: "https://datadna.onyxdata.co.uk/wp-content/uploads/2025/11/DataDNA-Dataset-Challenge-Animal-Shelter-Operations-December-2025.zip"
    dataset_folder: "DataDNA-Dataset-Challenge-Animal-Shelter-Operations-December-2025"
    formats: [CSV, DOCX, PDF, TXT]
    status: done
    notes: >-
      Completed 2025-12-29, G1-G8. FIRST REAL DATASET of Era 2 - City of Long Beach Animal
      Care Services, 52,339 stays, 2017-2025. Thesis: three of the brief's twelve guiding
      questions ask the file about its own processes rather than about its animals.
      (1) The live-release flag was_outcome_alive is a default, not a measurement - "not
      explicitly euthanasia or died" - so it counts 132 DISPOSAL records (120 subtype ACS
      DISPO, body disposal, which the file's OWN outcome_is_dead column flags as dead) and 399
      of the 400 animals still in the kennel as saved. 78.49% corrected against 79.26% filed,
      and 75.02% against 78.76% in 2025 because November is 45.1% unresolved.
      (2) Age is a staff estimate for 37.77% of animals: 17,301 of 45,814 DOBs share the exact
      month AND day of the intake date against ~125 expected by chance, with implied ages
      clustering on whole years. Drop them and the senior penalty mostly dissolves - 12y+ goes
      from 77.46% to 87.73% and every adult band lands between 87.7% and 93.3%.
      (3) The weekday intake pattern is the opening hours: public-counter intakes swing 14.14pp
      across the week, field officers 3.13pp.
      THE CONTROL: seasonality reads the same in BOTH channels (2.85x summer peak in the
      officer series too), which is what makes the weekday result a finding rather than a
      story. The signature chart is four measurements each done twice - three move, one holds,
      and the one that holds is drawn in the page's only third colour.
      Affirmative half: intake CONDITION predicts survival better than anything else here
      (Cramér's V = 0.530 vs species 0.382; 95.2% NORMAL to 20.8% ILL SEVERE). Largest outcome
      is RESCUE (12,233), not ADOPTION (11,170). Adoption is the SLOWEST live outcome (median
      25 days vs rescue's 5), so Q12's two goals conflict. A repeat intake is usually not a
      failure - 95.07% live against 77.30%. Q5's breed half is unanswerable: no breed column.
